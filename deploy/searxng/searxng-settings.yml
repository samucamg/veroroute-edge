use_default_settings: true

general:
  debug: false
  instance_name: "SearXNG Gateway Search"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: ""
  # IMPORTANTE: Formato json habilitado para a API do VeroRoute Edge / Pollin Uptime!
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "change_me_to_a_random_secret_key_for_production"
  base_url: false
  image_proxy: false

ui:
  static_use_hash: true

redis:
  url: redis://redis:6379/0
