# Stack SearXNG para Portainer
# Copie e cole na aba Stacks -> Add stack no Portainer Web UI
# Compativel com VeroRoute Edge e Pollin Uptime

version: '3.8'

services:
  searxng-redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    tmpfs:
      - /var/run/redis:rw,noexec,nosuid,size=64k
    networks:
      - searxng-internal

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    networks:
      - searxng-internal
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_SECRET=u9f8w4jf98w4jf98234h98fh2938hf23
      - SEARXNG_REDIS_URL=redis://searxng-redis:6379/0
    depends_on:
      - searxng-redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

networks:
  searxng-internal:
    driver: bridge
